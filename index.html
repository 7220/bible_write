<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성경 받아쓰기</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 헤더 -->
        <header class="header">
            <h1>📖 성경 받아쓰기</h1>
            <p class="subtitle">말씀을 마음에 새기세요</p>
        </header>

        <!-- 설정 패널 -->
        <section class="settings-panel">
            <div class="setting-group">
                <label for="book-select">성경</label>
                <select id="book-select">
                    <option value="">성경을 선택하세요</option>
                </select>
            </div>

            <div class="setting-group">
                <label for="chapter-select">장</label>
                <select id="chapter-select" disabled>
                    <option value="">장을 선택하세요</option>
                </select>
            </div>

            <div class="setting-group">
                <label>출제 방식</label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="mode" value="sequential" checked>
                        <span class="radio-custom"></span>
                        순차적
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="mode" value="random">
                        <span class="radio-custom"></span>
                        랜덤
                    </label>
                    <label>
                </div>
            </div>

            <div class="setting-group">
                <label>띄어쓰기 확인 방식</label>
                <div class="radio-group">
                    <label>
                        <input type="radio" name="spacing" value="strict" checked>
                        <span>엄격하게 확인</span>
                    </label>
                    <label>
                        <input type="radio" name="spacing" value="loose">
                        <span>띄어쓰기 무시</span>
                    </label>
                </div>
            </div>

            <button id="start-btn" class="btn btn-primary" disabled>
                시작하기
            </button>
        </section>

        <!-- 받아쓰기 영역 -->
        <section class="dictation-area" id="dictation-area" style="display: none;">
            <div class="progress-bar">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <p class="progress-text" id="progress-text">0 / 0</p>

            <div class="verse-info" id="verse-info">
                <!-- 장:절 표시 -->
            </div>

            <div class="hint-area">
                <button class="btn btn-hint" id="hint-btn">💡 힌트 보기</button>
                <p class="hint-text" id="hint-text" style="display: none;"></p>
            </div>

            <div class="input-area">
                <textarea 
                    id="answer-input" 
                    placeholder="성경 구절을 입력하세요..."
                    rows="4"
                ></textarea>
            </div>

            <div class="button-group">
                <button id="check-btn" class="btn btn-primary">확인하기</button>
                <button id="skip-btn" class="btn btn-secondary">건너뛰기</button>
            </div>

            <!-- 결과 표시 -->
            <div class="result-area" id="result-area" style="display: none;">
                <div class="result-card" id="result-card">
                    <h3 id="result-title"></h3>
                    <div class="comparison">
                        <div class="comparison-item">
                            <span class="label">정답</span>
                            <p id="correct-answer"></p>
                        </div>
                        <div class="comparison-item">
                            <span class="label">입력</span>
                            <p id="user-answer"></p>
                        </div>
                    </div>
                    <button id="next-btn" class="btn btn-primary">다음 구절</button>
                </div>
            </div>
        </section>

        <!-- 최종 결과 -->
        <section class="final-result" id="final-result" style="display: none;">
            <div class="result-summary">
                <h2>🎉 완료!</h2>
                <div class="score-circle">
                    <span id="final-score">0</span>
                    <span class="score-label">점</span>
                </div>
                <p class="score-detail" id="score-detail"></p>
                <button id="restart-btn" class="btn btn-primary">다시 시작</button>
            </div>
        </section>

        <!-- 푸터 -->
        <footer class="footer">
            <p>매일 말씀과 함께하는 시간 되세요 🙏</p>
        </footer>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
